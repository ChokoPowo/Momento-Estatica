<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Force & Moment Mechanics</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #050505; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
    
    header { padding: 18px 20px 10px 20px; font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
    
    #viewport-container { width: 100%; height: 350px; background-color: #0d0e12; position: relative; }
    #canvas3d { width: 100%; height: 100%; display: block; }
    
    .metrics-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; background: #000000; padding: 12px 10px; border-bottom: 1px solid #1a1a1a; text-align: center; }
    .metric-item { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .metric-label { font-size: 9px; text-transform: uppercase; color: #8e8e93; font-weight: 600; margin-bottom: 3px; letter-spacing: 0.5px; }
    .metric-value { font-size: 11px; font-weight: 700; color: #ffffff; white-space: nowrap; }
    
    .controls-container { padding: 20px; display: flex; flex-direction: column; gap: 18px; max-width: 600px; margin: 0 auto; width: 100%; }
    
    .upload-btn { background-color: #2c2c2e; color: #ffffff; border: none; padding: 14px; border-radius: 20px; font-size: 15px; font-weight: 500; text-align: center; cursor: pointer; display: block; width: 100%; transition: background 0.2s; }
    .upload-btn:active { background-color: #3a3a3c; }
    input[type="file"] { display: none; }
    
    .control-row { display: flex; justify-content: space-between; align-items: center; }
    .control-label { font-size: 15px; font-weight: 400; color: #e5e5ea; }
    
    select.dark-select { background-color: #1c1c1e; color: #ffffff; border: none; padding: 8px 12px; border-radius: 10px; font-size: 14px; outline: none; width: 160px; text-align: right; }
    
    .slider-group { display: flex; align-items: center; gap: 12px; }
    .slider-value { background-color: #1c1c1e; padding: 6px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; min-width: 50px; text-align: center; }
    input[type="range"] { -webkit-appearance: none; width: 130px; height: 4px; background: #3a3a3c; border-radius: 2px; outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #ffffff; cursor: pointer; }
    
    .switch { position: relative; display: inline-block; width: 48px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-toggle { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3a3a3c; transition: .3s; border-radius: 28px; }
    .slider-toggle:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider-toggle { background-color: #34c759; }
    input:checked + .slider-toggle:before { transform: translateX(20px); }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <header>3D Force & Moment Mechanics</header>

  <div id="viewport-container">
    <canvas id="canvas3d"></canvas>
  </div>

  <div class="metrics-bar">
    <div class="metric-item">
      <span class="metric-label">POSITION R</span>
      <span class="metric-value">(341.4, 141.4, 0) mm</span>
    </div>
    <div class="metric-item">
      <span class="metric-label">FORCE F</span>
      <span class="metric-value">(-25, -43.3, 0) N</span>
    </div>
    <div class="metric-item">
      <span class="metric-label">MOMENT M_O</span>
      <span class="metric-value">-11.24 k N·m</span>
    </div>
    <div class="metric-item">
      <span class="metric-label">PROJECTIONS</span>
      <span class="metric-value">Mx=0, My=0</span>
    </div>
  </div>

  <div class="controls-container">
    <label class="upload-btn" for="stlFileInput">Upload STL</label>
    <input type="file" id="stlFileInput" accept="*/*">

    <div class="control-row">
      <span class="control-label">Camera View</span>
      <select id="cameraSelect" class="dark-select">
        <option value="isometric">Isometric</option>
        <option value="top">Top (XY Plane)</option>
        <option value="side">Side (XZ Plane)</option>
      </select>
    </div>

    <div class="control-row">
      <span class="control-label">Mesh Opacity</span>
      <div class="slider-group">
        <input type="range" id="opacitySlider" min="0" max="1" step="0.1" value="0.8">
        <span id="opacityVal" class="slider-value">0.8</span>
      </div>
    </div>

    <div class="control-row">
      <span class="control-label">Show Force F</span>
      <label class="switch">
        <input type="checkbox" id="toggleForce" checked>
        <span class="slider-toggle"></span>
      </label>
    </div>

    <div class="control-row">
      <span class="control-label">Show Position r</span>
      <label class="switch">
        <input type="checkbox" id="togglePos" checked>
        <span class="slider-toggle"></span>
      </label>
    </div>

    <div class="control-row">
      <span class="control-label">Show Moment M_O</span>
      <label class="switch">
        <input type="checkbox" id="toggleMoment" checked>
        <span class="slider-toggle"></span>
      </label>
    </div>

    <div class="control-row">
      <span class="control-label">Show XY Torque Ring</span>
      <label class="switch">
        <input type="checkbox" id="toggleRing" checked>
        <span class="slider-toggle"></span>
      </label>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    const container = document.getElementById('viewport-container');
    const canvas = document.getElementById('canvas3d');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0e12);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 5000);
    camera.position.set(450, 350, 550);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(150, 70, 0);
    controls.enableDamping = true;

    // Luces
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(200, 500, 300);
    scene.add(dirLight);

    // Rejilla en mm
    const grid = new THREE.GridHelper(800, 20, 0x2c2c2e, 0x1c1c1e);
    grid.position.set(200, 0, 0);
    scene.add(grid);

    // Ejes
    const axes = new THREE.AxesHelper(200);
    scene.add(axes);

    let stlMesh = null;
    const stlMat = new THREE.MeshStandardMaterial({
      color: 0x8e8e93,
      metalness: 0.3,
      roughness: 0.4,
      transparent: true,
      opacity: 0.8
    });

    // Vectores
    const rPos = new THREE.Vector3(341.42, 141.42, 0);
    const posArrow = new THREE.ArrowHelper(rPos.clone().normalize(), new THREE.Vector3(0,0,0), rPos.length(), 0x34c759, 20, 10);
    scene.add(posArrow);

    const fDir = new THREE.Vector3(-0.5, -0.866, 0).normalize();
    const forceArrow = new THREE.ArrowHelper(fDir, rPos, 120, 0xff3b30, 22, 11);
    scene.add(forceArrow);

    const momentArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, -1), new THREE.Vector3(0,0,0), 160, 0x007aff, 28, 14);
    scene.add(momentArrow);

    // Torque Ring
    const ringGeo = new THREE.RingGeometry(55, 60, 32, 1, 0, Math.PI * 1.5);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xff9500, side: THREE.DoubleSide });
    const torqueRing = new THREE.Mesh(ringGeo, ringMat);
    torqueRing.rotation.x = Math.PI / 2;
    scene.add(torqueRing);

    // Carga de STL con escalado automático nativo
    const stlLoader = new STLLoader();
    document.getElementById('stlFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const geometry = stlLoader.parse(event.target.result);
        geometry.computeBoundingBox();
        
        if (stlMesh) scene.remove(stlMesh);
        stlMesh = new THREE.Mesh(geometry, stlMat);

        // Auto escalado nativo (Soporta mm y metros)
        const size = new THREE.Vector3();
        geometry.boundingBox.getSize(size);
        if (size.x < 5) {
          stlMesh.scale.set(1000, 1000, 1000);
        } else {
          stlMesh.scale.set(1, 1, 1);
        }

        scene.add(stlMesh);
      };
      reader.readAsArrayBuffer(file);
    });

    // Control de cámaras
    document.getElementById('cameraSelect').addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === 'isometric') {
        camera.position.set(450, 350, 550);
        controls.target.set(150, 70, 0);
      } else if (val === 'top') {
        camera.position.set(170, 700, 0);
        controls.target.set(170, 0, 0);
      } else if (val === 'side') {
        camera.position.set(170, 70, 700);
        controls.target.set(170, 70, 0);
      }
    });

    // Deslizador de opacidad
    const opSlider = document.getElementById('opacitySlider');
    const opVal = document.getElementById('opacityVal');
    opSlider.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      opVal.textContent = v.toFixed(1);
      stlMat.opacity = v;
    });

    // Interruptores
    document.getElementById('toggleForce').addEventListener('change', (e) => forceArrow.visible = e.target.checked);
    document.getElementById('togglePos').addEventListener('change', (e) => posArrow.visible = e.target.checked);
    document.getElementById('toggleMoment').addEventListener('change', (e) => momentArrow.visible = e.target.checked);
    document.getElementById('toggleRing').addEventListener('change', (e) => torqueRing.visible = e.target.checked);

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
